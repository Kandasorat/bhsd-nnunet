deterministic: false
output_dir: /scratch/ke17/bhsd-nnunet/runs/source_faithful/csam_bhsd_fold0
model_selection: validation_foreground_macro_dice
unavoidable_deviations:
  - BHSD nnU-Net CT preprocessing and the frozen Dataset001 fold split replace the missing released data loader.
  - nnU-Net's -1 crop-padding label is mapped to semantic background for the upstream CrossEntropyLoss.
  - Contiguous 20-slice windows with edge clamping make the fixed-length CSAM slice MLP executable on BHSD.
  - Six BHSD labels replace the upstream three prostate-zone labels; selection uses frozen foreground macro Dice.
  - The released repository imports missing CAT_Net classes; its included C2BAMUNet CSAM architecture is used.
